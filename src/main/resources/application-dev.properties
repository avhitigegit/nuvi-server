# ─── DEV Profile ───────────────────────────────────────────────────────────────
# Local Docker MySQL (port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/online_renting
spring.datasource.username=renting_user
spring.datasource.password=renting_pass

# Auto-create/update schema on startup — safe for local development only
spring.jpa.hibernate.ddl-auto=update

# SQL query logging disabled — produces excessive noise in the console.
# To re-enable temporarily, set: logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=false

# Verbose security logging for debugging auth issues
logging.level.org.springframework.security=DEBUG
logging.level.com.nuvi=DEBUG

# In-memory admin user for Spring Security's basic auth (used in dev only)
spring.security.user.name=admin
spring.security.user.password=1234

# CORS — allow local frontend dev servers
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173

# ─── Mail (SMTP / Gmail) ────────────────────────────────────────────────────────
# Used only in dev (app.email.provider=smtp is the default).
# In production, SES is used instead and these properties are not needed.
# MAIL_PASSWORD must be a Gmail App Password (not your Google account password).
# Generate one at: Google Account → Security → 2-Step Verification → App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
