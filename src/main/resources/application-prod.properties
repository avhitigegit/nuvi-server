# ─── Production Profile ────────────────────────────────────────────────────────
# This file is loaded automatically when SPRING_PROFILES_ACTIVE=prod
# It activates HTTPS enforcement in SecurityConfig.

# Disable Swagger UI in production for security
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Frontend URL — must be explicitly set in production (no localhost fallback)
app.frontend-url=${FRONTEND_URL}

# CORS — only allow the real production frontend domain
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ─── Sentry Error Tracking ─────────────────────────────────────────────────────
# Real-time exception alerts with full stack trace + user context.
# Free tier: 5,000 errors/month — sufficient for most production workloads.
# Setup: sentry.io → Create project → Java Spring → copy DSN below
sentry.dsn=${SENTRY_DSN}
sentry.environment=production
# Capture 10% of transactions for performance monitoring (optional, adjust as needed)
sentry.traces-sample-rate=0.1

# ─── Email (AWS SES) ───────────────────────────────────────────────────────────
# Replaces Gmail SMTP in production — no daily limits, better deliverability
# Requires: domain verified in SES + production access approved by AWS
app.email.provider=ses
app.email.from=${SES_FROM_EMAIL}

# ─── Redis Rate Limiting ────────────────────────────────────────────────────────
# Switch to distributed Redis-backed rate limiting in production.
# All server instances share one counter per IP — prevents bypass via multiple instances.
app.ratelimit.provider=redis

# Re-enable Redis auto-configuration (excluded by default in application.properties)
spring.autoconfigure.exclude=

# AWS ElastiCache connection — set these in your environment / Secrets Manager
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true
