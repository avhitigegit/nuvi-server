# ─── Production Profile ────────────────────────────────────────────────────────
# This file is loaded automatically when SPRING_PROFILES_ACTIVE=prod
# It activates HTTPS enforcement in SecurityConfig.

# Disable Swagger UI in production for security
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Frontend URL — must be explicitly set in production (no localhost fallback)
app.frontend-url=${FRONTEND_URL}

# CORS — only allow the real production frontend domain
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
