spring.application.name=online-renting

# ─── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
# Access token: 24 hours
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Refresh token: 7 days
jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ─── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# ─── Springdoc / Swagger ───────────────────────────────────────────────────────
springdoc.override-with-generic-response=false
springdoc.swagger-ui.path=/swagger-ui.html

# ─── AWS S3 ────────────────────────────────────────────────────────────────────
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# ─── Password Reset ────────────────────────────────────────────────────────────
# Reset token validity: 15 minutes
app.password-reset.expiry-ms=900000
# Frontend URL used in the reset email link
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ─── Email Verification ────────────────────────────────────────────────────────
# Verification token validity: 24 hours
app.email-verification.expiry-ms=86400000

# ─── Phone Verification (SMS OTP) ─────────────────────────────────────────────
# Provider: mock (logs OTP to console) | sns (sends real SMS via AWS SNS)
app.sms.provider=mock
# OTP validity: 10 minutes
app.sms.otp-expiry-ms=600000

# ─── Mail (SMTP) ───────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Pagination ────────────────────────────────────────────────────────────────
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# ─── CORS ──────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080

# ─── JPA shared ────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
