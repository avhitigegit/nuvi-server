spring.application.name=online-renting

# ─── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
# Access token: 24 hours
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Refresh token: 7 days
jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ─── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# ─── Springdoc / Swagger ───────────────────────────────────────────────────────
springdoc.override-with-generic-response=false
springdoc.swagger-ui.path=/swagger-ui.html

# ─── AWS S3 ────────────────────────────────────────────────────────────────────
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# ─── S3 Pre-signed URL Expiry ──────────────────────────────────────────────────
# Item images are public marketplace content — 60-min URLs are acceptable
app.s3.item-image-url-expiry-minutes=60
# KYC / seller documents are private — short-lived URLs only
app.s3.doc-url-expiry-minutes=15

# ─── Password Reset ────────────────────────────────────────────────────────────
# Reset token validity: 15 minutes
app.password-reset.expiry-ms=900000
# Frontend URL used in the reset email link
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ─── Email Verification ────────────────────────────────────────────────────────
# Verification token validity: 24 hours
app.email-verification.expiry-ms=86400000

# ─── Phone Verification (SMS OTP) ─────────────────────────────────────────────
# Provider: mock (logs OTP to console) | sns (sends real SMS via AWS SNS)
app.sms.provider=mock
# OTP validity: 10 minutes
app.sms.otp-expiry-ms=600000

# ─── Email Provider ────────────────────────────────────────────────────────────
# smtp — JavaMail/Gmail, dev only (app.email.provider=smtp, spring.mail.* in application-dev.properties)
# ses  — AWS SES v2, production  (app.email.provider=ses,  SES_FROM_EMAIL env var required)
app.email.provider=smtp
app.email.from=${EMAIL_FROM:noreply@nuvi.com}

# ─── Rate Limiting ─────────────────────────────────────────────────────────────
# Provider: memory (Bucket4j in-process, default) | redis (distributed, production)
app.ratelimit.provider=memory

# ─── Redis ─────────────────────────────────────────────────────────────────────
# Redis auto-configuration is disabled by default so the app starts without a
# Redis server in development. Enabled in application-prod.properties.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ─── Pagination ────────────────────────────────────────────────────────────────
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# ─── Request Body Size Limit ───────────────────────────────────────────────────
# Max JSON body size: 512KB. Multipart (file uploads) are exempt — governed by spring.servlet.multipart.*
app.request.max-body-size-bytes=524288
# Tomcat fallback for chunked requests that omit Content-Length header
server.tomcat.max-swallow-size=524288

# ─── Sentry Error Tracking ─────────────────────────────────────────────────────
# Empty DSN disables Sentry — no events are sent in dev.
# Set SENTRY_DSN in production environment to enable real-time error reporting.
# Get your DSN from: sentry.io → Project → Settings → Client Keys (DSN)
sentry.dsn=
sentry.environment=development

# ─── CORS ──────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080

# ─── JPA shared ────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
# Tell the JDBC driver to send and receive all TIMESTAMP values as UTC.
# Without this, Hibernate reads DB timestamps using the server's local timezone,
# which corrupts stored times when the server is not in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─── Jackson ───────────────────────────────────────────────────────────────────
# Serialize dates as "2026-03-13T10:30:00" strings, not Unix epoch numbers.
spring.jackson.serialization.write-dates-as-timestamps=false
# All date/time values in JSON responses are expressed in UTC.
spring.jackson.time-zone=UTC
