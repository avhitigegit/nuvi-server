spring.application.name=online-renting

# ─── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=mySuperSecretKeyThatIsAtLeast32CharsLong123456
# Access token: 24 hours
jwt.expiration-ms=86400000
# Refresh token: 7 days
jwt.refresh-token-expiry-ms=604800000

# ─── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# ─── Springdoc / Swagger ───────────────────────────────────────────────────────
springdoc.override-with-generic-response=false
springdoc.swagger-ui.path=/swagger-ui.html

# ─── Password Reset ────────────────────────────────────────────────────────────
# Reset token validity: 15 minutes
app.password-reset.expiry-ms=900000
# Frontend URL used in the reset email link
app.frontend-url=http://localhost:3000

# ─── Mail (SMTP) ───────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=amrithagz123@gmail.com
spring.mail.password=giorzgiaxhnddaeg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── JPA shared ────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
